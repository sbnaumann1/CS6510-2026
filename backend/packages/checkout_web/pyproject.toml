[project]
name = "checkout-web"
version = "0.8.0"
description = "Shared conventions: contract error shape, request parsing, app factory, health check, money, request id, event envelope, bus and consumer loop"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "orjson==3.9.10",
    "pydantic==2.5.0",
    "aiokafka==0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_web"]
