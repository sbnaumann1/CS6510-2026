[project]
name = "checkout-data"
version = "0.6.0"
description = "Shared data-access library: schema, connections, table ownership, per-service repositories"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]==2.0.23",
    "greenlet>=3.0.0",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_data"]
