# Gateway: path router in front of the four microservices.
# Routing only — no validation, rewriting, caching or database access (spec FR-003).
# Route table: specs/007-microservices-architecture/contracts/gateway-routes.md, mirrored by
# tests/_dispatch.py and checked by tests/unit/test_gateway_routes.py.
# Two additions over 005: /internal/ (service-to-service routes) is never proxied, and every
# request carries an X-Request-ID so one id traces it across the services.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    # Docker's embedded DNS; `resolve` below re-resolves a restarted container's IP.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Keep a caller's X-Request-ID, otherwise use nginx's own per-request id.
    map $http_x_request_id $request_id_out {
        default $http_x_request_id;
        ""      $request_id;
    }

    # The load client reuses connections for the whole run.
    keepalive_timeout 75s;
    keepalive_requests 100000;

    upstream catalog {
        zone catalog 64k;
        server catalog:8000 resolve;
        keepalive 64;
        keepalive_requests 100000;
    }
    upstream checkout {
        zone checkout 64k;
        server checkout:8000 resolve;
        keepalive 64;
        keepalive_requests 100000;
    }
    upstream inventory {
        zone inventory 64k;
        server inventory:8000 resolve;
        keepalive 64;
        keepalive_requests 100000;
    }
    upstream analytics {
        zone analytics 64k;
        server analytics:8000 resolve;
        keepalive 64;
        keepalive_requests 100000;
    }

    # Shared by every proxied location: HTTP/1.1 keepalive upstream. The client's
    # Upgrade/HTTP2-Settings headers are cleared explicitly, so the services can run
    # httptools (spec 006 research R3; 001 research R14). No location may set its own
    # proxy_set_header, or it would stop inheriting these (test_gateway_routes.py).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Upgrade "";
    proxy_set_header HTTP2-Settings "";
    proxy_set_header X-Request-ID $request_id_out;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    # Services' own responses (including their errors) pass through unchanged;
    # only gateway-generated 502/503/504 are replaced by the JSON body below.
    proxy_intercept_errors off;

    server {
        listen 8080;

        location = /items {
            proxy_pass http://catalog;
            error_page 502 503 504 = @catalog_down;
        }

        location /transactions {
            proxy_pass http://checkout;
            error_page 502 503 504 = @checkout_down;
        }

        location /inventory/ {
            proxy_pass http://inventory;
            error_page 502 503 504 = @inventory_down;
        }

        location /analytics/ {
            proxy_pass http://analytics;
            error_page 502 503 504 = @analytics_down;
        }

        # Service-to-service routes live under /internal/ and are reachable only on the mesh.
        # Without this rule the default location would hand them to checkout.
        location /internal/ {
            default_type application/json;
            return 404 '{"error":"NOT_FOUND","message":"Not found."}';
        }

        location = /gateway/healthz {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # Anything else goes to checkout, so unknown paths get the same FastAPI
        # 404 ApiError body the monolith returned.
        location / {
            proxy_pass http://checkout;
            error_page 502 503 504 = @checkout_down;
        }

        location @catalog_down {
            default_type application/json;
            return 503 '{"error":"INTERNAL_ERROR","message":"catalog service is unavailable."}';
        }
        location @checkout_down {
            default_type application/json;
            return 503 '{"error":"INTERNAL_ERROR","message":"checkout service is unavailable."}';
        }
        location @inventory_down {
            default_type application/json;
            return 503 '{"error":"INTERNAL_ERROR","message":"inventory service is unavailable."}';
        }
        location @analytics_down {
            default_type application/json;
            return 503 '{"error":"INTERNAL_ERROR","message":"analytics service is unavailable."}';
        }
    }
}
