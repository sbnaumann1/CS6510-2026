# Test-stack override (007): the same topology with the small catalog the test suite
# expects, under its own project name, image tags and volumes so it never touches the
# measured stack's data. The two stacks cannot run at once (both bind :8080).
#
#   docker compose -f compose.yaml -f compose.test.yaml up -d --build --wait
#   GATEWAY_URL=http://localhost:8080 \
#   CHECKOUT_TEST_DATABASE_URL=postgresql+asyncpg://checkout_user:checkout_pass@127.0.0.1:5442/checkout \
#   INVENTORY_TEST_DATABASE_URL=postgresql+asyncpg://inventory_user:inventory_pass@127.0.0.1:5443/inventory \
#     uv run pytest -q tests/contract
#
# The suite's session fixtures do not drop schemas in gateway mode; its reset helpers only
# run in-process, so each gateway-mode run starts from a fresh `down -v`.
name: checkout-test

services:
  seed-catalog:
    image: checkout-catalog:test
    environment:
      CATALOG_SIZE: "50"
  seed-checkout:
    image: checkout-checkout:test
  seed-inventory:
    image: checkout-inventory:test
    environment:
      CATALOG_SIZE: "50"
      STOCK_PER_ITEM: "100"
  catalog:
    image: checkout-catalog:test
  checkout:
    image: checkout-checkout:test
  inventory:
    image: checkout-inventory:test
  analytics:
    image: checkout-analytics:test
  gateway:
    image: checkout-gateway:test
  tools:
    image: checkout-tools:test
