services:
  postgres:
    volumes:
      - pgsock:/var/run/postgresql
  checkout:
    environment:
      DATABASE_URL: postgresql+asyncpg://checkout:checkout@/checkout?host=/var/run/postgresql
    volumes:
      - pgsock:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgsock:
