# nginx with a per-request timing log. Relative paths resolve against backend/ (the
# compose project directory); PERF_RUNS is exported by run_exp.sh.
services:
  gateway:
    volumes:
      - ./specs/006-service-perf-investigation/harness/nginx-timing.conf:/etc/nginx/nginx.conf:ro
      - ${PERF_RUNS}/_nginxlog:/var/log/nginx
