[project]
name = "analytics-service"
version = "0.8.0"
description = "Analytics Service: popular-items streaming pipeline (no database; in-memory, pulls from Checkout)"
requires-python = ">=3.11"
dependencies = [
    "checkout-web==0.8.0",
    "python-dotenv==1.0.0",
    "orjson==3.9.10",
    "aiokafka==0.14.0",
]

[tool.uv.sources]
checkout-web = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_service"]
