[project]
name = "checkout-service"
version = "0.8.0"
description = "Checkout Service: running a basket from start to payment (own PostgreSQL database)"
requires-python = ">=3.11"
dependencies = [
    "checkout-web==0.8.0",
    "sqlalchemy[asyncio]==2.0.23",
    "greenlet>=3.0.0",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
    "httpx==0.25.2",
    "orjson==3.9.10",
    "aiokafka==0.14.0",
]

[tool.uv.sources]
checkout-web = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_service"]
