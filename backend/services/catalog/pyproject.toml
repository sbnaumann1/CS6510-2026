[project]
name = "catalog-service"
version = "0.5.0"
description = "Catalog Service: what can be sold, and at what price"
requires-python = ">=3.11"
dependencies = [
    "checkout-data==0.5.0",
    "checkout-web==0.5.0",
    "orjson==3.9.10",
]

[tool.uv.sources]
checkout-data = { workspace = true }
checkout-web = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_service"]
