[project]
name = "backend"
version = "0.7.0"
description = "Supermarket self-checkout system: microservices, a private store per service (spec 007)"
readme = "README.md"
requires-python = ">=3.11"
# The workspace root is not itself deployed: it installs every member so the
# test suite and scripts can import all of them. Each service image installs
# only its own member plus checkout-web (research R3).
dependencies = [
    "checkout-web",
    "catalog-service",
    "checkout-service",
    "inventory-service",
    "analytics-service",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
checkout-web = { workspace = true }
catalog-service = { workspace = true }
checkout-service = { workspace = true }
inventory-service = { workspace = true }
analytics-service = { workspace = true }

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
